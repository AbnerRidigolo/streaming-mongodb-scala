# Lint/type-check configuration shared by `make lint` and CI.

[flake8]
# Match black's default line length; E203/W503 conflict with black's style.
max-line-length = 88
extend-ignore = E203, W503
exclude = .venv,venv,data,.mypy_cache,.pytest_cache

[mypy]
python_version = 3.11
ignore_missing_imports = True
