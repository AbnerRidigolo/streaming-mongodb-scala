name: CI

# Every push runs CI, so feature branches are checked before a PR exists;
# a PR's checks are the runs of its head commit.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (black, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check producers spark_jobs dashboard scripts tests
      - run: flake8 producers spark_jobs dashboard scripts tests
      - run: mypy producers spark_jobs dashboard scripts

  python-tests:
    name: Python tests (local Spark + Delta, no Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Spark 3.4 supports Java 8/11/17 only; runner default may be newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Delta JARs are resolved by Ivy at SparkSession start-up.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements-dev.txt
      # Tests needing a live broker are skipped unless RUN_KAFKA_IT=1.
      - run: >
          pytest tests/ -v
          --cov=producers --cov=spark_jobs --cov-report=term

  java-order-status-service:
    name: Java tests (order-status-service, TopologyTestDriver)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-status-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            order-status-service/*.gradle.kts
            order-status-service/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew --no-daemon test

  scala-delivery-sla-job:
    name: Scala tests (delivery-sla-job, ScalaTest + MemoryStream)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-sla-job
    steps:
      - uses: actions/checkout@v4
      # Java 11, like the runtime image (apache/spark:3.4.1-scala2.12-java11).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt
          cache-dependency-path: |
            delivery-sla-job/build.sbt
            delivery-sla-job/project/build.properties
            delivery-sla-job/project/plugins.sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose needs the MongoDB passwords; random ones, only for this run.
      - run: scripts/gen_env.sh
      - run: docker compose build
      # Spark 3.4 needs Java 8/11/17; fail if a base image drifts to Java 21.
      - name: Spark images run Java 17
        run: |
          for svc in spark-pipeline dashboard; do
            docker compose run --rm --no-deps --entrypoint java "$svc" -version 2>&1 \
              | tee /dev/stderr | grep -q 'version "17\.'
          done

  smoke-e2e:
    name: End-to-end smoke test (both paths into MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the stack and check both paths
        run: |
          set -o pipefail
          scripts/smoke_e2e.sh 300 | tee smoke.log
      - name: Publish what the check saw
        if: always()
        run: |
          { echo '## End-to-end smoke test'; echo '```'; cat smoke.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 init order-status-service kafka mongo connect connect-init delivery-sla-job
      - name: Stop the stack
        if: always()
        run: docker compose down -v
